# Atlas CI (ATL-007).
# Job ids (lint, test, secrets-scan) are kept from the M0 skeleton so branch protection
# rules pointing at them stay valid.
# Target shape (docs/DEPLOYMENT.md): lint → typecheck → unit+integration → golden → e2e → build images.
# Golden/e2e/image stages are added when the corresponding surfaces exist (M1+).
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history + tags for the founder-dashboard freshness gate (QA-S1-1):
          # the generator stamps the last commit touching docs/**, which a shallow
          # clone misreports as the grafted boundary commit.
          fetch-depth: 0
          fetch-tags: true
      - uses: pnpm/action-setup@v4 # version comes from root package.json "packageManager"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install (TS workspaces)
        run: pnpm install --frozen-lockfile
      - name: Lint (eslint, all workspaces)
        run: pnpm lint
      - name: Typecheck (tsc --noEmit, all workspaces)
        run: pnpm typecheck
      - name: Format check (prettier, TS workspaces — QA-M0-4)
        # Runs in the workspaces that carry prettier (api, web, shared); the
        # dashboard-freshness step below regenerates root files only, so the two
        # gates cannot interfere.
        run: pnpm format:check
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Ruff (analytics)
        working-directory: services/analytics
        run: |
          uv sync
          uv run ruff check .
          uv run ruff format --check .
      - name: Mypy strict (analytics)
        working-directory: services/analytics
        run: uv run mypy src
      - name: Founder dashboard freshness (ATL-021 / DL-013)
        # The dashboard is generated-only and deterministic (timestamp from git, not wall
        # clock), so a diff here means coordination/docs changed without `pnpm dashboard`.
        run: |
          pnpm dashboard
          git diff --exit-code FOUNDER_DASHBOARD.md FOUNDER_DASHBOARD.html

  test:
    runs-on: ubuntu-latest
    # Real Postgres for the api pg-integration suite (ATL-024 / QA-M0-3): without it
    # the suite self-skips (gated on DATABASE_URL_TEST) and CI is green-by-absence.
    # The skip-gate stays intact for contributors without a local Postgres.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: atlas
          POSTGRES_PASSWORD: atlas
          POSTGRES_DB: atlas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U atlas -d atlas_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install (TS workspaces)
        run: pnpm install --frozen-lockfile
      - name: Tests (vitest, all workspaces — pg integration runs against the service container)
        env:
          # Matches the service container above. The test suite TRUNCATEs this
          # database between tests — it is throwaway CI state, never real data.
          DATABASE_URL_TEST: postgresql://atlas:atlas@127.0.0.1:5432/atlas_test
        run: pnpm test
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Tests (pytest, analytics — golden suite joins here in M1, blocking)
        working-directory: services/analytics
        run: |
          uv sync
          uv run pytest

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Placeholder kept deliberately: gitleaks/gitleaks-action@v2 requires a GITLEAKS_LICENSE
      # secret for organization repos; wiring it needs a repo-settings/secret decision (human
      # owner / CEO). Tracked as an ATL-007 follow-up in the handoff.
      - name: Gitleaks (placeholder — needs GITLEAKS_LICENSE decision)
        run: echo "gitleaks wiring pending license/secret decision; see ATL-007 handoff" && exit 0
